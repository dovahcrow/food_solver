[workspace]
members = ["rust/food-core", "rust/food-cli", "rust/food-mcp"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1"
culpa = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clarabel = "0.11"
clap = { version = "4", features = ["derive"] }
rmcp = { version = "3", default-features = false, features = ["server", "transport-io", "macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
schemars = "1"
ureq = "3.3"
scraper = "0.18"
regex = "1"
calamine = "0.36"
